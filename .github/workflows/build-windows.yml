name: Build Windows XiaoZhi MCP Tester

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v1.2.0']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 (microphone, speaker, Opus)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows native audio libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-portaudio
      - name: Verify native dependencies and run tests
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          go version
          pkg-config --modversion opus portaudio-2.0
          # The desktop app uses Opus live encoder/decoder only; it does not need opusfile.
          # hraban/opus provides this official build tag to avoid the unused opusfile dependency.
          go mod download
          go test -mod=mod -tags nolibopusfile ./...
      - name: Build and bundle Windows x64 app
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: gcc
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -mod=mod -tags nolibopusfile -trimpath -ldflags="-s -w -H=windowsgui" -o dist/XiaoZhi-PC.exe .
          cp /ucrt64/bin/libopus-0.dll /ucrt64/bin/libportaudio.dll dist/
          # Include UCRT64 runtime libraries when present (portable ZIP).
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll; do
            if [ -f "/ucrt64/bin/$dll" ]; then cp "/ucrt64/bin/$dll" dist/; fi
          done
          cp docs/windows-testing-vi.md dist/HUONG_DAN.md
          cp /ucrt64/bin/libstdc++-6.dll dist/ 2>/dev/null || true
          ls -lah dist/
          ldd dist/XiaoZhi-PC.exe || true
      - name: Package portable release
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath XiaoZhi-PC-v1.2.0-Windows-x64.zip -Force
      - name: Upload portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-go-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release: XiaoZhi PC v1.2.0')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 "XiaoZhi-PC-v1.1.0-Windows-x64.zip" --title "XiaoZhi PC v1.2.0 - Qoobee Edition" --notes "XiaoZhi PC v1.2.0 with redesigned consumer UI, six embedded Qoobee GIFs, first-time-only activation code, existing voice and music features. Keep device_config.json to preserve pairing." --target "${{ github.sha }}"
